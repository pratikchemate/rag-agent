name: Supabase and Backend Keepalive

on:
  schedule:
    # Run every Monday and Thursday at 06:00 UTC to prevent free-tier project pause
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping-services:
    name: Keepalive Ping for Backend and Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Readiness (Wakes Render & Queries Supabase DB)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is not configured"
            exit 1
          fi
          echo "Sending readiness probe to backend ($BACKEND_URL/api/v1/health/ready)..."
          curl -s -f --retry 3 --retry-delay 30 --max-time 120 "$BACKEND_URL/api/v1/health/ready"

      - name: Secondary Ping to Supabase REST Endpoint
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "Sending secondary keepalive request to Supabase REST endpoint..."
            curl -s -f -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/"
          else
            echo "SUPABASE_URL secret is not configured; skipping secondary ping."
          fi

